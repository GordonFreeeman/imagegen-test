name: Reconstruct Inspect

on:
  push:
    branches: [ "agent/local-flux-studio-sdk36" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct payload
        shell: bash
        run: |
          set -euxo pipefail
          cat android-project.part* | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/project.bin
          wc -c /tmp/project.bin
          file /tmp/project.bin
          xxd -l 128 /tmp/project.bin
          echo "---- tar probe ----"
          tar -tf /tmp/project.bin | head -100 || true
          echo "---- zip probe ----"
          unzip -l /tmp/project.bin | head -100 || true
          echo "---- text probe ----"
          head -80 /tmp/project.bin || true
