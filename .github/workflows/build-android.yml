name: Build Android APK

on:
  push:
    branches: [ "agent/local-flux-studio-sdk36" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-flux-studio-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain and Vulkan shader compiler
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Vendor pinned inference engines
        run: |
          chmod +x scripts/vendor-deps.sh
          ./scripts/vendor-deps.sh

      - name: Build, unit test and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify APK and SDK targeting
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | tee /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          grep -q "sdkVersion:'29'" /tmp/badging.txt
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalFluxStudio-sdk36-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
